name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Registry lint
        run: scitype lint
      - name: Emitted artifacts are current
        run: |
          scitype emit
          git diff --exit-code published conformance
      - name: Conformance corpus
        run: pytest -q
      - name: CLI smoke test
        run: |
          scitype schemas
          echo '{"covers":{"n":4,"arcs":[[0,2],[0,3],[1,2],[1,3]]}}' \
            | scitype id FinitePoset -

  browser:
    name: Browser build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/typebase/package-lock.json
      - run: npm --prefix web/typebase ci
      - run: npm --prefix web/typebase run build
