name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Registry lint
        run: scitype lint
      - name: Emitted artifacts are current
        run: |
          scitype emit
          git diff --exit-code published conformance
          test -z "$(git status --porcelain published conformance)"
      - name: Conformance corpus
        run: pytest -q
      - name: CLI smoke test
        run: |
          scitype schemas
          echo '{"covers":{"n":4,"arcs":[[0,2],[0,3],[1,2],[1,3]]}}' \
            | scitype id FinitePoset -

  browser:
    name: Browser build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/typebase/package-lock.json
      - run: npm --prefix web/typebase ci
      - run: npm --prefix web/typebase run build

  rust:
    name: Rust and independent enumeration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FLINT_PREFIX: ${{ github.workspace }}/.noether-native/.deps/flint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential m4 pkg-config curl
      - name: Install the tested Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.95.0
      - name: Build the pinned native dependencies
        run: |
          git clone https://github.com/tertius-ai/noether.git .noether-native
          git -C .noether-native checkout eebc33d4f37ed47af83c88dbc9f8886b254f72c6
          bash .noether-native/scripts/install-flint.sh
      - run: make check
      - run: make lint
      - run: make test
      - run: make test-oracles
